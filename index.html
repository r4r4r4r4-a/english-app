<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Words</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f0ebe2;
    --fg: #111;
    --muted: #6b655b;
    --card: #f7f2e8;
    --line: #d9d2c3;
    --ok: #2e7d32;
    --bad: #c62828;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; }
  html, body { overflow: hidden; overscroll-behavior: none; }
  #app { height: var(--tg-viewport-stable-height, 100dvh); max-height: 100dvh; overflow: hidden; display: flex; flex-direction: column; padding: calc(16px + var(--top-inset, 0px)) 20px calc(24px + var(--bot-inset, 0px)); }
  .top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; gap: 8px; }
  .top .group { display: flex; gap: 8px; }
  .pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .pill button { all: unset; cursor: pointer; }
  .screen { flex: 1; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; min-height: 0; }
  .screen.active { display: flex; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .word { font-family: Georgia, "Iowan Old Style", serif; font-weight: 800; font-size: clamp(40px, 13vw, 64px); margin: 0; word-break: break-word; }
  .ipa { color: var(--muted); font-size: 16px; }
  .meaning { font-size: 22px; line-height: 1.35; max-width: 90%; margin: 6px 0 0; }
  .row { font-size: 16px; color: var(--muted); max-width: 90%; }
  .row b { color: var(--fg); font-weight: 600; }
  .example { font-size: 17px; font-style: italic; color: var(--fg); max-width: 88%; margin-top: 6px; line-height: 1.4; }
  .prompt { font-size: 24px; line-height: 1.35; max-width: 92%; }
  .prompt em { font-style: normal; font-weight: 700; }
  #ans { resize: none; font-family: inherit; line-height: 1.35; width: 100%; max-width: 420px; font-size: 20px; padding: 14px 16px; text-align: center;
    border: 2px solid var(--fg); border-radius: 10px; background: transparent; color: var(--fg); outline: none; }
  #ans.ok { border-color: var(--ok); }
  #ans.bad { border-color: var(--bad); }
  #ans.neutral { border-color: var(--muted); }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
  #ans.shake { animation: shake .38s ease; }
  .note { margin-top: 10px; font-size: 15px; font-style: italic; color: var(--muted); max-width: 340px; margin-left: auto; margin-right: auto; line-height: 1.4; }
  .result { min-height: 52px; font-size: 17px; }
  .result.ok { color: var(--ok); }
  .result.bad { color: var(--bad); }
  .result.neutral { color: var(--fg); }
  .btn { width: 100%; max-width: 420px; padding: 16px; font-size: 18px; font-weight: 600; border: 0;
    border-radius: 14px; background: var(--fg); color: var(--bg); cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--muted); font-weight: 500; font-size: 15px; padding: 10px; }
  .bottom { display: flex; flex-direction: column; align-items: center; gap: 4px; }

  /* bottom tab bar */
  .tabs { position: relative; display: flex; width: 100%; max-width: 420px; margin-top: 14px; padding: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .thumb { position: absolute; top: 6px; bottom: 6px; left: 0; width: 0; border-radius: 999px; background: #e4ddd0;
    translate: var(--x, 6px) 0; scale: var(--s, 1); pointer-events: none; z-index: 0;
    transition: translate .42s cubic-bezier(.3,1.3,.5,1), scale .22s ease, background .2s, box-shadow .2s; }
  .thumb.drag { transition: scale .22s ease, background .2s, box-shadow .2s; }
  .thumb.lift { --s: 1.16; background: rgba(255,255,255,.62); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 6px 20px rgba(60,45,20,.18), inset 0 0 0 1px rgba(255,255,255,.85); }
  .tab { all: unset; flex: 1; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 0 7px; border-radius: 999px; font-size: 12px; color: var(--muted); position: relative; z-index: 1;
    transition: color .15s, scale .28s cubic-bezier(.3,1.4,.5,1); }
  .tabs.holding .tab.active { scale: 1.18; }
  .tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab.active { color: var(--fg); }
  .badge { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: var(--fg); color: var(--bg); font-size: 11px; line-height: 18px; text-align: center; }

  /* learned list */
  #s-list { justify-content: flex-start; align-items: stretch; text-align: left; overflow-y: auto; padding-top: 8px; gap: 0; }
  #s-list h2 { margin: 8px 0 12px; font-size: 22px; text-align: center; }
  .item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .item .en { font-family: Georgia, serif; font-weight: 700; font-size: 18px; }
  .item .lv { color: var(--muted); font-size: 12px; margin-left: 6px; font-family: -apple-system, system-ui, sans-serif; font-weight: 500; }
  .item .tr { color: var(--muted); font-size: 15px; text-align: right; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="pill" id="counter">✓ 0 / 0</div>
    <div class="group">
      <div class="pill"><button id="levelBtn">All</button></div>
      <div class="pill"><button id="langBtn">RU</button></div>
    </div>
  </div>

  <!-- Screen 1: word card -->
  <div class="screen active" id="s-card">
    <h1 class="word" id="w"></h1>
    <div class="ipa" id="ipa"></div>
    <p class="meaning" id="meaning"></p>
    <div class="row" id="syn"></div>
    <div class="row" id="ant"></div>
    <div class="example" id="ex"></div>
  </div>

  <!-- Screen 2: translate -->
  <div class="screen" id="s-quiz">
    <div class="prompt" id="prompt"></div>
    <textarea id="ans" rows="3" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="…"></textarea>
    <div class="result" id="res"></div>
  </div>

  <!-- Screen 3: learned words -->
  <div class="screen" id="s-list">
    <h2 id="listTitle"></h2>
    <div id="listBody"></div>
  </div>

  <div class="bottom">
    <button class="btn" id="mainBtn">Next</button>
    <button class="btn ghost" id="skipBtn" style="display:none">Не знаю</button>
    <nav class="tabs">
      <div class="thumb" id="thumb"></div>
      <button class="tab active" id="tabWords">
        <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
        <span id="tabWordsLbl">Words</span>
      </button>
      <button class="tab" id="tabHistory">
        <svg viewBox="0 0 24 24"><path d="M12 7c-1.5-1.5-4-2.2-8-2v13c4-.2 6.5.5 8 2 1.5-1.5 4-2.2 8-2V5c-4-.2-6.5.5-8 2z"/><path d="M12 7v13"/></svg>
        <span id="tabHistoryLbl">History</span>
        <span class="badge" id="badge">0</span>
      </button>
    </nav>
  </div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#f0ebe2'); tg.setBackgroundColor('#f0ebe2'); } catch(e){} }
// Tablets / large screens: ask Telegram for fullscreen and keep content below its overlay buttons
function applyInsets(){
  try {
    const s = (tg.safeAreaInset||{}).top||0, c = (tg.contentSafeAreaInset||{}).top||0;
    const b = (tg.safeAreaInset||{}).bottom||0;
    document.documentElement.style.setProperty("--top-inset", (s + c) + "px");
    document.documentElement.style.setProperty("--bot-inset", b + "px");
  } catch(e){}
}
if (tg) {
  try {
    if (Math.min(screen.width, screen.height) >= 700 && tg.requestFullscreen && !tg.isFullscreen) tg.requestFullscreen();
    tg.onEvent && tg.onEvent("fullscreenChanged", applyInsets);
    tg.onEvent && tg.onEvent("safeAreaChanged", applyInsets);
    tg.onEvent && tg.onEvent("contentSafeAreaChanged", applyInsets);
    applyInsets();
  } catch(e){}
}
const haptic = (t) => { try { tg.HapticFeedback.notificationOccurred(t); } catch(e){} };

/* ---- Words. lvl = CEFR level, ex = example sentence ---- */
const WORDS = [
  {"pos":"adj","en": "good", "lvl": "A1", "ipa": "ɡʊd", "tr": {"ru": "хороший", "uk": "хороший"}, "exTr": {"ru": "Это хорошая книга.", "uk": "Це гарна книга."}, "syn": ["nice", "fine"], "ant": ["bad"], "ex": "This is a good book."},
  {"pos":"adj","en": "bad", "lvl": "A1", "ipa": "bæd", "tr": {"ru": "плохой", "uk": "поганий"}, "exTr": {"ru": "Сегодня плохая погода.", "uk": "Сьогодні погана погода."}, "syn": ["poor", "awful"], "ant": ["good"], "ex": "The weather is bad today."},
  {"pos":"adj","en": "big", "lvl": "A1", "ipa": "bɪɡ", "tr": {"ru": "большой", "uk": "великий"}, "exTr": {"ru": "У них большой дом.", "uk": "У них великий будинок."}, "syn": ["large", "huge"], "ant": ["small", "little"], "ex": "They have a big house."},
  {"pos":"adj","en": "small", "lvl": "A1", "ipa": "smɔːl", "tr": {"ru": "маленький", "uk": "маленький"}, "exTr": {"ru": "Я живу в маленьком городе.", "uk": "Я живу в маленькому місті."}, "syn": ["little", "tiny"], "ant": ["big", "large"], "ex": "I live in a small town."},
  {"pos":"adj","en": "new", "lvl": "A1", "ipa": "njuː", "tr": {"ru": "новый", "uk": "новий"}, "exTr": {"ru": "Я купил новый телефон.", "uk": "Я купив новий телефон."}, "syn": ["fresh", "modern"], "ant": ["old"], "ex": "I bought a new phone."},
  {"pos":"adj","en": "old", "lvl": "A1", "ipa": "əʊld", "tr": {"ru": "старый", "uk": "старий"}, "exTr": {"ru": "Мой дедушка очень старый.", "uk": "Мій дідусь дуже старий."}, "syn": ["aged", "ancient"], "ant": ["new", "young"], "ex": "My grandfather is very old."},
  {"pos":"adj","en": "hot", "lvl": "A1", "ipa": "hɒt", "tr": {"ru": "горячий, жаркий", "uk": "гарячий, спекотний"}, "exTr": {"ru": "Суп слишком горячий.", "uk": "Суп занадто гарячий."}, "syn": ["boiling", "scorching"], "ant": ["cold", "cool"], "ex": "The soup is too hot."},
  {"pos":"adj","en": "cold", "lvl": "A1", "ipa": "kəʊld", "tr": {"ru": "холодный", "uk": "холодний"}, "exTr": {"ru": "На улице холодно.", "uk": "На вулиці холодно."}, "syn": ["chilly", "freezing"], "ant": ["hot", "warm"], "ex": "It is cold outside."},

  {"pos":"adj","en": "tired", "lvl": "A1", "ipa": "ˈtaɪəd", "tr": {"ru": "уставший", "uk": "втомлений"}, "exTr": {"ru": "Я устал после работы.", "uk": "Я втомився після роботи."}, "syn": ["exhausted", "sleepy"], "ant": ["energetic", "rested"], "ex": "I am tired after work."},
  {"pos":"adj","en": "angry", "lvl": "A2", "ipa": "ˈæŋɡri", "tr": {"ru": "злой, сердитый", "uk": "злий, сердитий"}, "exTr": {"ru": "Он был зол из-за задержки.", "uk": "Він був злий через затримку."}, "syn": ["furious", "mad"], "ant": ["calm", "pleased"], "ex": "He was angry about the delay."},
  {"pos":"adj","en": "boring", "lvl": "A2", "ipa": "ˈbɔːrɪŋ", "tr": {"ru": "скучный", "uk": "нудний"}, "exTr": {"ru": "Лекция была скучной.", "uk": "Лекція була нудною."}, "syn": ["dull", "tedious"], "ant": ["interesting", "exciting"], "ex": "The lecture was boring."},
  {"pos":"adj","en": "busy", "lvl": "A2", "ipa": "ˈbɪzi", "tr": {"ru": "занятой, оживленный", "uk": "зайнятий"}, "exTr": {"ru": "Я сейчас занят.", "uk": "Я зараз зайнятий."}, "syn": ["occupied", "active"], "ant": ["free", "idle"], "ex": "I am busy right now."},
  {"pos":"adj","en": "careful", "lvl": "A2", "ipa": "ˈkeəfl", "tr": {"ru": "осторожный, внимательный", "uk": "обережний, уважний"}, "exTr": {"ru": "Будь осторожен на льду.", "uk": "Будь обережним на льоду."}, "syn": ["attentive", "watchful"], "ant": ["careless"], "ex": "Be careful on the ice."},

const $ = (id)=>document.getElementById(id);
const store = {
  get(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

let lang = store.get("lang", (tg?.initDataUnsafe?.user?.language_code === "uk") ? "uk" : "ru");
let level = store.get("level", "All");
let learned = store.get("learned", []);   // only words answered correctly
let queue = [], cur = null, stage = "card", checked = false, correctCount = 0, seen = 0, prevStage = null;

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pool(){ return WORDS.filter(w => level === "All" || w.lvl === level); }
function nextWord(){
  if (!queue.length) {
    let p = pool();
    if (!p.length) p = WORDS;
    queue = shuffle(p);
    // don't repeat the same word twice in a row
    if (cur && queue.length > 1 && queue[queue.length-1].en === cur.en) queue.unshift(queue.pop());
  }
  cur = queue.pop();
}
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); $(id).classList.add("active"); }
function updateCounter(){
  $("counter").textContent = `✓ ${correctCount} / ${seen}`;
  $("badge").textContent = learned.length;
}
const navEl = document.querySelector(".tabs"), thumb = $("thumb"), TABS = [$("tabWords"), $("tabHistory")];

function setTab(t){ curTab = t === "history" ? 1 : 0; paintActive(curTab); placeThumb(curTab); }
function relayout(){
  thumb.style.transition = "none"; placeThumb(curTab); void thumb.offsetWidth; thumb.style.transition = "";

function renderCard(){

let canOverride = false, cardShownAt = 0, quickSkips = 0;
const CONTR = [[/\bit's\b/g,"it is"],[/\bhe's\b/g,"he is"],[/\bshe's\b/g,"she is"],[/\bthat's\b/g,"that is"],[/\bthere's\b/g,"there is"],[/\bwhat's\b/g,"what is"],
  [/\bi'm\b/g,"i am"],[/\b(you|we|they)'re\b/g,"$1 are"],[/\b(i|you|we|they)'ve\b/g,"$1 have"],[/\b(i|you|he|she|it|we|they)'ll\b/g,"$1 will"],
  [/\bdon't\b/g,"do not"],[/\bdoesn't\b/g,"does not"],[/\bdidn't\b/g,"did not"],[/\bisn't\b/g,"is not"],[/\baren't\b/g,"are not"],
  [/\bwasn't\b/g,"was not"],[/\bweren't\b/g,"were not"],[/\bcan't\b/g,"cannot"],[/\bwon't\b/g,"will not"],[/\bhaven't\b/g,"have not"]];
const NUM = {0:"zero",1:"one",2:"two",3:"three",4:"four",5:"five",6:"six",7:"seven",8:"eight",9:"nine",10:"ten",11:"eleven",12:"twelve",13:"thirteen",14:"fourteen",15:"fifteen",16:"sixteen",17:"seventeen",18:"eighteen",19:"nineteen",20:"twenty",30:"thirty",40:"forty",50:"fifty",60:"sixty",70:"seventy",80:"eighty",90:"ninety",100:"hundred"};
function normS(s){
  s = s.toLowerCase().replace(/[’‘`]/g, "'");
  CONTR.forEach(([r,t]) => { s = s.replace(r, t); });
  s = s.replace(/\b\d+\b/g, (n) => NUM[+n] || n);   // "5" -> "five" so digits are accepted too
  return s.replace(/[^a-z0-9'\s-]/g, " ").replace(/\s+/g, " ").trim();
}
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n+1}, (_, j) => j);
  for (let i = 1; i <= m; i++){
    const cur_ = [i];
    for (let j = 1; j <= n; j++) cur_[j] = Math.min(prev[j] + 1, cur_[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur_;
  }
  return prev[n];
}
function similarity(a, b){ const L = Math.max(a.length, b.length); return L ? 1 - lev(a, b) / L : 1; }

function markLearned(){
  if (!learned.includes(cur.en)) { learned.push(cur.en); store.set("learned", learned); }
}

// ---- grading: the NEW WORD is what matters; other words may differ a little ----
const SUFFIXES = ["", "s", "es", "ed", "d", "ing", "ly"];
const IRREG = { child: ["children"], person: ["people", "persons"], life: ["lives"], criteria: ["criterion"], hand: ["hands"] };
function wordForms(w){
  const f = new Set(SUFFIXES.map(s => w + s));
  (IRREG[w] || []).forEach(x => f.add(x));
  if (w.endsWith("e")) f.add(w.slice(0, -1) + "ing");
  if (w.endsWith("y")) { f.add(w.slice(0, -1) + "ies"); f.add(w.slice(0, -1) + "ied"); }
  if (w.endsWith("le")) f.add(w.slice(0, -1) + "y");
  return [...f];
}
function tokenIs(tok, w){
  const forms = wordForms(w);
  if (forms.includes(tok)) return true;
  return w.length >= 5 && tok.length >= 5 && forms.some(f => similarity(tok, f) >= 0.85);   // tolerate a typo
}
function grade(){
  const val = normS($("ans").value), ref = normS(cur.ex);
  if (val === ref) return { kind: "exact" };
  const sim = similarity(val, ref);
  const at = val.split(" ").filter(Boolean), rt = ref.split(" ").filter(Boolean);
  const target = cur.en.toLowerCase();
  const usedTarget = at.some(t => tokenIs(t, target));
  if (usedTarget && sim >= 0.9) return { kind: "typo" };
  const rest = rt.filter(t => !tokenIs(t, target));
  const hit = rest.filter(t => at.some(x => x === t || (t.length >= 5 && x.length >= 5 && similarity(x, t) >= 0.8))).length;
  const overlap = rest.length ? hit / rest.length : 1;
  // must look like a real translation: enough words, and enough of the sentence in common
  const enough = at.length >= Math.max(2, Math.ceil(rt.length * 0.7)) && overlap >= 0.5;
  if (usedTarget) return enough ? { kind: "word", same: overlap === 1 && at.length === rt.length } : { kind: "short" };
  const padded = " " + val + " ";
  const syn = cur.syn.find(s => { s = s.toLowerCase(); return s.includes(" ") ? padded.includes(" " + s + " ") : at.some(t => tokenIs(t, s)); });
  if (syn && enough) return { kind: "syn", syn };
  return { kind: "none" };
}

function check(giveUp){
  const a = $("ans"), r = $("res"), L = UI[lang], w = cur.en;
  const g = giveUp ? null : grade();
  seen++;
  a.disabled = true; checked = true; canOverride = false;
  if (!giveUp) quickSkips = 0;
  if (giveUp){
    // skipped: neutral, no "wrong", not counted as learned
    a.className = "neutral"; r.className = "result neutral";
    r.innerHTML = `${L.answer} <b>${cur.ex}</b>`;
    // several skips in a row within a few seconds of seeing the word -> gentle nudge
    quickSkips = (Date.now() - cardShownAt < 4000) ? quickSkips + 1 : 0;
    if (quickSkips >= 3) { quickSkips = 0; r.innerHTML += `<div class="note">${L.rushMsg}</div>`; haptic("warning"); }
  } else if (g.kind === "exact"){
    correctCount++; markLearned();
    a.className = "ok"; r.className = "result ok"; r.textContent = L.correct; haptic("success");
  } else if (g.kind === "typo"){
    correctCount++; markLearned();
    a.className = "ok"; r.className = "result ok";
    r.innerHTML = `${L.typo}<br>${L.ref} <b>${cur.ex}</b>`; haptic("success");
  } else if (g.kind === "word"){
    // the new word is used correctly; other words may differ -> counts as learned
    correctCount++; markLearned();
    a.className = "ok"; r.className = "result ok";
    r.innerHTML = g.same ? L.okWord(w) : `${L.okWordDiff(w)}<br>${L.asExample} <b>${cur.ex}</b>`; haptic("success");
  } else if (g.kind === "syn"){
    // right meaning, but a synonym instead of the new word -> correct answer, word NOT added to history
    correctCount++;
    a.className = "ok"; r.className = "result ok";
    r.innerHTML = `${L.synOnly(w, g.syn)}<br>${L.ref} <b>${cur.ex}</b>`; haptic("warning");
  } else {
    a.className = "bad"; r.className = "result bad";
    r.innerHTML = `${g.kind === "short" ? L.tooShort(w) : L.noWord(w)}<br>${L.ref} <b>${cur.ex}</b>`; haptic("error");
  }
  updateCounter();
  $("mainBtn").textContent = L.next;
  $("skipBtn").style.display = "none";
}

/* ---- learned list ---- */
function openList(){
  if (stage !== "list") { prevStage = stage; stage = "list"; }
  $("listTitle").textContent = `${UI[lang].learned} (${learned.length})`;
  const body = $("listBody");
  body.innerHTML = "";
  if (!learned.length){
    const d = document.createElement("div"); d.className = "empty"; d.textContent = UI[lang].empty; body.appendChild(d);
  } else {
    learned.slice().reverse().forEach(en => {
      const w = WORDS.find(x => x.en === en); if (!w) return;
      const row = document.createElement("div"); row.className = "item";
      const l = document.createElement("div"); l.className = "en"; l.textContent = w.en;
      const lv = document.createElement("span"); lv.className = "lv"; lv.textContent = w.lvl; l.appendChild(lv);
      const r = document.createElement("div"); r.className = "tr"; r.textContent = w.tr[lang] || w.tr.ru;
      row.append(l, r); body.appendChild(row);
    });
  }
  show("s-list");
  $("mainBtn").style.display = "none";
  $("skipBtn").style.display = "none";
  setTab("history");
}
function closeList(){
  stage = prevStage || "card";
  $("mainBtn").style.display = ""; setTab("words");
  if (stage === "card") { renderCard(); return; }
  show("s-quiz");
  if (checked) { $("mainBtn").textContent = UI[lang].next; $("skipBtn").style.display = canOverride ? "" : "none"; }
  else { $("mainBtn").textContent = UI[lang].check; $("skipBtn").style.display = ""; $("ans").focus(); }
}

function nudgeEmpty(){
  const a = $("ans"), r = $("res");
  r.className = "result neutral"; r.textContent = UI[lang].emptyMsg;
  a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake"); a.focus();
  haptic("warning");
}
$("ans").addEventListener("input", ()=>{ if (!checked){ $("res").textContent = ""; $("res").className = "result"; } });

function onMain(){
  if (stage === "list") return closeList();
  if (stage === "card") return renderQuiz();
  if (stage === "quiz" && !checked){
    if (!$("ans").value.trim()) return nudgeEmpty();
    return check(false);
  }
  nextWord(); renderCard();
}

$("mainBtn").addEventListener("click", onMain);
$("skipBtn").addEventListener("click", ()=>{ if (!checked) check(true); });
function goTab(i){
  if (i === 1) { if (stage !== "list") openList(); }
  else if (stage === "list") closeList();
  setTab(i === 1 ? "history" : "words");
}
// keyboard activation only (pointer input is handled below)
$("tabWords").addEventListener("click", (e)=>{ if (e.detail === 0) goTab(0); });
$("tabHistory").addEventListener("click", (e)=>{ if (e.detail === 0) goTab(1); });

// press & hold the highlight, drag it between tabs, release to snap (like Telegram / iOS)
const thumbX = ()=>parseFloat(thumb.style.getPropertyValue("--x")) || TABS[curTab].offsetLeft;
const nearest = (x)=>TABS.reduce((b,t,k)=>Math.abs(t.offsetLeft - x) < Math.abs(TABS[b].offsetLeft - x) ? k : b, 0);
navEl.addEventListener("pointerdown", (e)=>{
  if (e.pointerType === "mouse" && e.button !== 0) return;
  try { navEl.setPointerCapture(e.pointerId); } catch(_) {}
  drag = { id: e.pointerId, startX: e.clientX, x0: thumbX(), moved: false };
  thumb.classList.add("lift"); navEl.classList.add("holding");
  try { tg.HapticFeedback.selectionChanged(); } catch(_) {}
});
navEl.addEventListener("pointermove", (e)=>{
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.startX;
  if (!drag.moved && Math.abs(dx) < 4) return;
  drag.moved = true; thumb.classList.add("drag");
  const x = Math.max(TABS[0].offsetLeft, Math.min(TABS[TABS.length-1].offsetLeft, drag.x0 + dx));
  thumb.style.setProperty("--x", x + "px");
  const i = nearest(x);
  if (!TABS[i].classList.contains("active")) { paintActive(i); try { tg.HapticFeedback.selectionChanged(); } catch(_) {} }
});
function endDrag(e, cancelled){
  if (!drag || e.pointerId !== drag.id) return;
  let i;
  if (cancelled) i = curTab;
  else if (drag.moved) i = nearest(thumbX());
  else i = nearest(e.clientX - navEl.getBoundingClientRect().left - 1 - TABS[0].offsetWidth / 2);
  drag = null;
  thumb.classList.remove("lift", "drag"); navEl.classList.remove("holding");
  goTab(i);
}
navEl.addEventListener("pointerup", (e)=>endDrag(e, false));
navEl.addEventListener("pointercancel", (e)=>endDrag(e, true));
window.addEventListener("resize", relayout);
$("ans").addEventListener("keydown", (e)=>{ if (e.key === "Enter"){ e.preventDefault(); onMain(); } });
$("langBtn").addEventListener("click", ()=>{
  lang = LANGS[(LANGS.indexOf(lang)+1) % LANGS.length];
  store.set("lang", lang);
  $("langBtn").textContent = lang.toUpperCase();
  $("tabHistoryLbl").textContent = lang === "uk" ? "Історія" : "История";
  if (stage === "list") { stage = prevStage; openList(); }
  else if (stage === "card") renderCard();
  else if (!checked) renderQuiz();
});
$("levelBtn").addEventListener("click", ()=>{
  level = LEVELS[(LEVELS.indexOf(level)+1) % LEVELS.length];
  store.set("level", level);
  $("levelBtn").textContent = level;
  queue = []; cur = null;
  nextWord(); renderCard();
});

$("langBtn").textContent = lang.toUpperCase();
$("tabHistoryLbl").textContent = lang === "uk" ? "Історія" : "История";
$("tabWordsLbl").textContent = lang === "uk" ? "Слова" : "Слова";
$("levelBtn").textContent = level;
nextWord(); renderCard();
relayout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
</script>
</body>
</html>
